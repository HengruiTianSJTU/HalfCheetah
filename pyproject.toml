[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "halfcheetah-course"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["gymnasium[mujoco]==1.2.1", "stable-baselines3==2.7.0", "numpy>=1.26,<3", "matplotlib>=3.8,<4", "imageio[ffmpeg]>=2.34,<3", "PyYAML>=6,<7", "psutil>=5.9,<8"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]
